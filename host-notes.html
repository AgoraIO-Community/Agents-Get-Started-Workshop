<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Host notes · Agora workshop</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf1f7;background:#10151d;line-height:1.6}*{box-sizing:border-box}body{margin:0}main{max-width:46rem;margin:auto;padding:1.25rem}header{position:sticky;top:0;background:#10151df5;border-bottom:1px solid #303c4c;padding:.8rem 1.25rem;z-index:1}header div{max-width:43.5rem;margin:auto;display:flex;gap:1rem;justify-content:space-between;align-items:center}h1{font-size:1.5rem;line-height:1.3}h2{font-size:1.2rem}p{margin:.75rem 0}label{display:block;margin-top:1rem}input,button{font:inherit;border-radius:.5rem;padding:.7rem .9rem;border:1px solid #526071}input{width:100%;background:#1b2430;color:inherit}button{cursor:pointer;background:#1786ff;color:white;min-height:44px}form button{margin-top:1.25rem}#status,#position,#timing,#next{color:#b4c3d6;font-size:.9rem}#error{color:#ffb9ac}#notes{font-size:1.075rem;overflow-wrap:anywhere}#notes li{margin:.55rem 0}a{color:#80bdff}code,pre{background:#1b2430;border-radius:.3rem;padding:.15rem .3rem;white-space:pre-wrap;overflow-wrap:anywhere}#reconnect{font-size:.85rem;padding:.4rem .7rem;background:#1b2430}.demo-script{border-left:3px solid #439bff;padding:.5rem 1rem;background:#182533}.demo-script dt{font-weight:700;color:#80bdff;margin-top:.8rem}.demo-script dd{margin:.25rem 0 .6rem}hr{border:0;border-top:1px solid #303c4c;margin:1.5rem 0}[hidden]{display:none!important}
</style>
<script defer src="/assets/host-notes.js"></script>
</head>
<body>
<header><div><span id="status" role="status" aria-live="polite">Host notes</span><button id="reconnect" hidden>Reconnect</button></div></header>
<main>
<form id="join">
<h1>Follow your slides</h1>
<p>Open the host presentation on your computer. Use the same channel here to follow its notes on your phone.</p>
<label for="channel">Workshop channel</label><input id="channel" required autocapitalize="none" spellcheck="false" maxlength="48">
<label for="key">Host password</label><input id="key" type="password" required autocomplete="current-password">
<button type="submit">Open notes</button>
<p id="error" role="alert"></p>
</form>
<section id="companion" hidden>
<p id="position"></p><h1 id="title">Waiting for the host</h1><p id="timing"></p>
<div id="notes"><p>Notes will appear when the host presentation connects to this channel.</p></div>
<hr><p id="next"></p>
</section>
</main>
</body>
</html>
